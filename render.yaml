services:
  # 1. Backend Express API (Render Free Web Service)
  - type: web
    name: jobpilot-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Frontend React SPA (Render Free Static Site)
  - type: web
    name: jobpilot-frontend
    runtime: static
    buildCommand: npm install && npm run build:client
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

